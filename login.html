<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Query AI | Secure Portal Authentication</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Path -->
    <link rel="stylesheet" href="./static/style.css">
    <style>
        .auth-container { max-width: 500px; width: 100%; margin: 0 auto; }
        .btn-social { cursor: pointer; }
        .auth-card { box-shadow: 0 20px 50px rgba(99, 102, 241, 0.25); }
    </style>
</head>
<body class="theme-dark auth-page-body" style="padding: 30px 15px;">
    <!-- Glowing Orbs Background -->
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <!-- Top Navigation Bar -->
    <div style="width:100%; max-width: 1200px; display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; z-index: 20;">
        <div style="display:flex; align-items:center; gap:10px; font-family:var(--font-heading); font-weight:700; font-size:1.2rem;">
            <i class="fa-solid fa-graduation-cap" style="color:var(--primary);"></i> EduQuery AI Portal
        </div>
        <a href="index.html" class="btn-secondary" style="text-decoration: none; padding: 8px 18px; border-radius: 20px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; background: rgba(99,102,241,0.2); border-color: var(--primary);">
            <span>Platform Home</span> <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <div class="auth-container">
        <!-- Brand Header -->
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h1>Portal Sign In</h1>
            <p>Please enter your account ID and password to proceed</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tabs Header -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabStudentBtn" onclick="switchAuthTab('student')">
                    <i class="fa-solid fa-user-graduate"></i> Student Login
                </button>
                <button class="auth-tab" id="tabAdminBtn" onclick="switchAuthTab('admin')">
                    <i class="fa-solid fa-user-gear"></i> Admin / Faculty
                </button>
                <button class="auth-tab" id="tabSignupBtn" onclick="switchAuthTab('signup')">
                    <i class="fa-solid fa-user-plus"></i> New Sign Up
                </button>
            </div>

            <!-- Validation Toast Alert Box -->
            <div class="auth-alert" id="authAlert" style="display: none; padding: 12px; margin-top: 16px; border-radius: 10px; font-size: 0.85rem; text-align: center; font-weight: 500;"></div>

            <!-- Login Form (Strict Validation Required) -->
            <form id="loginForm" class="auth-form" style="margin-top: 16px;">
                <input type="hidden" id="loginRole" value="student">
                
                <div class="input-group">
                    <label for="authIdentifier"><i class="fa-solid fa-user"></i> Student Name, ID, or Email *</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="authIdentifier" placeholder="Enter your ID or Email" required autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="authPassword"><i class="fa-solid fa-key"></i> Password *</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="authPassword" placeholder="Enter your password" required autocomplete="off">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('authPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <span style="font-size: 0.72rem; color: #94a3b8; margin-top: 4px;">
                        <i class="fa-solid fa-lock"></i> Mandatory field. Try default student password: <strong style="color:#6366f1">student123</strong> or <strong style="color:#6366f1">1234</strong>
                    </span>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked> Remember Session
                    </label>
                    <a href="#" class="forgot-pass" onclick="alert('Demo Passwords:\nStudent: student123 or 1234\nAdmin: admin123')">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Verify Credentials & Sign In</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <!-- Sign Up Form (Strict Validation Required) -->
            <form id="signupForm" class="auth-form" style="display: none; margin-top: 16px;">
                <div class="input-group">
                    <label for="regFullName"><i class="fa-solid fa-user"></i> Full Name *</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="regFullName" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regEmail"><i class="fa-solid fa-envelope"></i> Email Address *</label>
                    <div class="input-field-wrapper">
                        <input type="email" id="regEmail" placeholder="Enter your email address" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regCourse"><i class="fa-solid fa-book"></i> Select Course *</label>
                    <div class="input-field-wrapper">
                        <select id="regCourse" required style="width:100%; background:transparent; border:none; color:#fff; padding:6px 0; outline:none;">
                            <option value="B.Tech Computer Science" style="background:#0f172a; color:#fff;">B.Tech Computer Science</option>
                            <option value="B.Sc Data Science" style="background:#0f172a; color:#fff;">B.Sc Data Science</option>
                            <option value="BCA" style="background:#0f172a; color:#fff;">BCA</option>
                            <option value="MCA" style="background:#0f172a; color:#fff;">MCA</option>
                            <option value="MBA" style="background:#0f172a; color:#fff;">MBA</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regPassword"><i class="fa-solid fa-lock"></i> Create Password *</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="regPassword" placeholder="Create a password (min 4 chars)" required minlength="4">
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Register & Sign In</span> <i class="fa-solid fa-user-check"></i>
                </button>
            </form>

            <!-- Social OAuth Sign In -->
            <div class="auth-divider">
                <span>OR SIGN IN WITH SOCIAL ACCOUNT</span>
            </div>

            <div class="social-logins">
                <button type="button" class="btn-social btn-social-google" onclick="strictSocialSignIn('Google')">
                    <i class="fa-brands fa-google"></i> Sign in with Google / Email
                </button>
                <button type="button" class="btn-social btn-social-apple" onclick="strictSocialSignIn('Apple')">
                    <i class="fa-brands fa-apple"></i> Sign in with Apple ID
                </button>
                <button type="button" class="btn-social btn-social-github" onclick="strictSocialSignIn('GitHub')">
                    <i class="fa-brands fa-github"></i> Sign in with GitHub
                </button>
            </div>
        </div>
    </div>

    <!-- Auth Logic Script with Strict Validation -->
    <script>
        function formatName(rawInput) {
            if (!rawInput) return "Student";
            let clean = rawInput.trim();
            if (clean.includes('@')) {
                clean = clean.split('@')[0];
            }
            return clean.replace(/\./g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function showNotification(msg, isSuccess = true) {
            const box = document.getElementById('authAlert');
            box.style.display = 'block';
            box.style.background = isSuccess ? 'rgba(16, 185, 129, 0.25)' : 'rgba(239, 68, 68, 0.25)';
            box.style.border = isSuccess ? '1px solid #10b981' : '1px solid #ef4444';
            box.style.color = isSuccess ? '#6ee7b7' : '#fca5a5';
            box.innerHTML = msg;
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginRole = document.getElementById('loginRole');
            document.getElementById('authAlert').style.display = 'none';

            if (tab === 'student') {
                document.getElementById('tabStudentBtn').classList.add('active');
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                loginRole.value = 'student';
            } else if (tab === 'admin') {
                document.getElementById('tabAdminBtn').classList.add('active');
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                loginRole.value = 'admin';
            } else if (tab === 'signup') {
                document.getElementById('tabSignupBtn').classList.add('active');
                loginForm.style.display = 'none';
                signupForm.style.display = 'flex';
            }
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            }
        }

        function saveUserSession(userObj) {
            localStorage.setItem('eduquery_user', JSON.stringify(userObj));
        }

        function executeSignInRedirect(userObj) {
            saveUserSession(userObj);
            showNotification(`✅ Verified! Welcome ${userObj.name}. Launching platform...`, true);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 600);
        }

        function strictSocialSignIn(provider) {
            const typedVal = document.getElementById('authIdentifier').value.trim();
            let userName = "";

            if (typedVal && typedVal.length >= 2) {
                userName = formatName(typedVal);
            } else {
                const promptedName = prompt(`Please enter your Name or Email to complete ${provider} Sign In:`, "");
                if (!promptedName || !promptedName.trim()) {
                    showNotification(`❌ ${provider} Sign In cancelled: Name or Email is required.`, false);
                    return;
                }
                userName = formatName(promptedName);
            }

            const userObj = {
                name: userName,
                id: 'STU-' + Math.floor(1000 + Math.random() * 9000),
                role: 'Student',
                provider: provider,
                authenticated: true,
                email: `${userName.toLowerCase().replace(/\s+/g, '')}@${provider.toLowerCase()}.com`
            };

            executeSignInRedirect(userObj);
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const rawIdentifier = document.getElementById('authIdentifier').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const role = document.getElementById('loginRole').value || "student";

            // Strict Validation Checks
            if (!rawIdentifier || rawIdentifier.length < 2) {
                showNotification("❌ Please enter your Student Name, ID, or Email.", false);
                document.getElementById('authIdentifier').focus();
                return;
            }

            if (!password) {
                showNotification("❌ Please enter your Password to sign in.", false);
                document.getElementById('authPassword').focus();
                return;
            }

            if (role === 'admin' && password !== 'admin123' && password !== '1234') {
                showNotification("❌ Invalid Admin Password! (Default Admin Pass: <strong>admin123</strong>)", false);
                document.getElementById('authPassword').focus();
                return;
            }

            const displayName = formatName(rawIdentifier);

            const userObj = {
                name: displayName,
                id: role === 'student' ? 'STU-' + Math.floor(1000 + Math.random() * 9000) : 'ADM-101',
                role: role === 'student' ? 'Student' : 'Admin',
                authenticated: true,
                email: rawIdentifier.includes('@') ? rawIdentifier : `${displayName.toLowerCase().replace(/\s+/g, '')}@university.edu`
            };

            executeSignInRedirect(userObj);
        });

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const course = document.getElementById('regCourse').value;
            const password = document.getElementById('regPassword').value.trim();

            if (!fullName) {
                showNotification("❌ Please enter your Full Name.", false);
                return;
            }
            if (!email || !email.includes('@')) {
                showNotification("❌ Please enter a valid Email Address.", false);
                return;
            }
            if (!password || password.length < 4) {
                showNotification("❌ Password must be at least 4 characters long.", false);
                return;
            }

            const userObj = {
                name: formatName(fullName),
                id: 'STU-' + Math.floor(1000 + Math.random() * 9000),
                role: 'Student',
                course: course,
                authenticated: true,
                email: email
            };

            executeSignInRedirect(userObj);
        });
    </script>
</body>
</html>
