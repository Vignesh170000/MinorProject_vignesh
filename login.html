<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Query AI | Portal Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Relative CSS Path works both in Flask and via direct file opening -->
    <link rel="stylesheet" href="./static/style.css">
</head>
<body class="theme-dark auth-page-body">
    <!-- Glowing Orbs Background -->
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <div class="auth-container">
        <!-- Brand Header -->
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>EduQuery AI</h1>
            <p>Student Academic Helpdesk & Query Portal</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tabs Header -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabStudentBtn" onclick="switchAuthTab('student')">
                    <i class="fa-solid fa-user-graduate"></i> Student Login
                </button>
                <button class="auth-tab" id="tabAdminBtn" onclick="switchAuthTab('admin')">
                    <i class="fa-solid fa-user-gear"></i> Admin / Faculty
                </button>
                <button class="auth-tab" id="tabSignupBtn" onclick="switchAuthTab('signup')">
                    <i class="fa-solid fa-user-plus"></i> Sign Up
                </button>
            </div>

            <!-- Error / Success Alert -->
            <div class="auth-alert" id="authAlert" style="display: none;"></div>

            <!-- Login Form (Student / Admin) -->
            <form id="loginForm" class="auth-form">
                <input type="hidden" id="loginRole" value="student">
                
                <div class="input-group">
                    <label for="authIdentifier"><i class="fa-solid fa-envelope"></i> Student ID or Email</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="authIdentifier" placeholder="e.g. STU-2026 or student@university.edu" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="authPassword"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="authPassword" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('authPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked> Remember Me
                    </label>
                    <a href="#" class="forgot-pass" onclick="alert('Password reset link sent to registered email!')">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Login to Portal</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <!-- Sign Up Form (Hidden by default) -->
            <form id="signupForm" class="auth-form" style="display: none;">
                <div class="input-group">
                    <label for="regFullName"><i class="fa-solid fa-user"></i> Full Name</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="regFullName" placeholder="e.g. Vignesh R" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regEmail"><i class="fa-solid fa-envelope"></i> University Email</label>
                    <div class="input-field-wrapper">
                        <input type="email" id="regEmail" placeholder="e.g. vignesh@university.edu" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regCourse"><i class="fa-solid fa-book"></i> Enrolled Course</label>
                    <div class="input-field-wrapper">
                        <select id="regCourse" required style="width:100%; background:transparent; border:none; color:#fff; padding:8px 0; outline:none;">
                            <option value="B.Tech Computer Science" style="background:#0f172a; color:#fff;">B.Tech Computer Science</option>
                            <option value="B.Sc Data Science" style="background:#0f172a; color:#fff;">B.Sc Data Science</option>
                            <option value="BCA" style="background:#0f172a; color:#fff;">BCA (Computer Applications)</option>
                            <option value="MCA" style="background:#0f172a; color:#fff;">MCA (Master of Computer Applications)</option>
                            <option value="MBA" style="background:#0f172a; color:#fff;">MBA</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regPassword"><i class="fa-solid fa-lock"></i> Create Password</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="regPassword" placeholder="Create a strong password" required>
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Create Student Account</span> <i class="fa-solid fa-user-check"></i>
                </button>
            </form>

            <!-- Quick Demo Login Shortcuts -->
            <div class="demo-logins">
                <span class="demo-label"><i class="fa-solid fa-bolt"></i> Quick Demo Login:</span>
                <div class="demo-buttons">
                    <button type="button" class="demo-btn" onclick="quickDemoLogin('student')">
                        <i class="fa-solid fa-user-graduate"></i> Demo Student
                    </button>
                    <button type="button" class="demo-btn admin" onclick="quickDemoLogin('admin')">
                        <i class="fa-solid fa-user-shield"></i> Demo Admin
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth JS Script -->
    <script>
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginRole = document.getElementById('loginRole');
            const alertBox = document.getElementById('authAlert');
            alertBox.style.display = 'none';

            if (tab === 'student') {
                document.getElementById('tabStudentBtn').classList.add('active');
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                loginRole.value = 'student';
                document.getElementById('authIdentifier').placeholder = "e.g. STU-2026 or student@university.edu";
            } else if (tab === 'admin') {
                document.getElementById('tabAdminBtn').classList.add('active');
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                loginRole.value = 'admin';
                document.getElementById('authIdentifier').placeholder = "e.g. ADM-101 or admin@university.edu";
            } else if (tab === 'signup') {
                document.getElementById('tabSignupBtn').classList.add('active');
                loginForm.style.display = 'none';
                signupForm.style.display = 'flex';
            }
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            }
        }

        function quickDemoLogin(role) {
            if (role === 'student') {
                saveUserSession({
                    name: 'Vignesh R',
                    id: 'STU-2026',
                    role: 'Student',
                    course: 'B.Tech Computer Science',
                    email: 'vignesh@university.edu'
                });
            } else {
                saveUserSession({
                    name: 'Dr. Administrator',
                    id: 'ADM-101',
                    role: 'Admin',
                    department: 'Academic Helpdesk',
                    email: 'admin@university.edu'
                });
            }
            window.location.href = 'index.html';
        }

        function saveUserSession(userObj) {
            localStorage.setItem('eduquery_user', JSON.stringify(userObj));
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const identifier = document.getElementById('authIdentifier').value.trim();
            const role = document.getElementById('loginRole').value;
            
            const userObj = {
                name: identifier.split('@')[0] || identifier,
                id: role === 'student' ? 'STU-2026' : 'ADM-101',
                role: role === 'student' ? 'Student' : 'Admin',
                email: identifier.includes('@') ? identifier : `${identifier}@university.edu`
            };

            saveUserSession(userObj);
            window.location.href = 'index.html';
        });

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const course = document.getElementById('regCourse').value;

            const userObj = {
                name: fullName,
                id: 'STU-' + Math.floor(1000 + Math.random() * 9000),
                role: 'Student',
                course: course,
                email: email
            };

            saveUserSession(userObj);
            alert("Account registered successfully! Redirecting to Portal...");
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
