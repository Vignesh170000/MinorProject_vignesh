<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Query AI | Secure Portal Authentication</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Relative CSS Path works both in Flask and via direct file opening -->
    <link rel="stylesheet" href="./static/style.css">
</head>
<body class="theme-dark auth-page-body">
    <!-- Glowing Orbs Background -->
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <div class="auth-container">
        <!-- Brand Header -->
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>EduQuery AI</h1>
            <p>Secure Student Academic Helpdesk & Guided Platform</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tabs Header -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabStudentBtn" onclick="switchAuthTab('student')">
                    <i class="fa-solid fa-user-graduate"></i> Student Login
                </button>
                <button class="auth-tab" id="tabAdminBtn" onclick="switchAuthTab('admin')">
                    <i class="fa-solid fa-user-gear"></i> Admin / Faculty
                </button>
                <button class="auth-tab" id="tabSignupBtn" onclick="switchAuthTab('signup')">
                    <i class="fa-solid fa-user-plus"></i> Sign Up
                </button>
            </div>

            <!-- Error / Success Alert Box -->
            <div class="auth-alert" id="authAlert" style="display: none; padding: 10px 14px; margin-top: 14px; border-radius: 8px; font-size: 0.82rem; text-align: center;"></div>

            <!-- Login Form (Password Authenticated) -->
            <form id="loginForm" class="auth-form" style="margin-top: 14px;">
                <input type="hidden" id="loginRole" value="student">
                
                <div class="input-group">
                    <label for="authIdentifier"><i class="fa-solid fa-envelope"></i> Student Name, ID, or Email</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="authIdentifier" placeholder="e.g. Alex Smith or alex@university.edu" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="authPassword"><i class="fa-solid fa-lock"></i> Account Password</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="authPassword" placeholder="Enter password (default: student123)" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('authPassword', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <span style="font-size: 0.72rem; color: #94a3b8; margin-top: 2px;">
                        <i class="fa-solid fa-circle-info"></i> Default Student Password: <strong style="color:#6366f1">student123</strong> | Admin: <strong style="color:#8b5cf6">admin123</strong>
                    </span>
                </div>

                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" checked> Remember Session
                    </label>
                    <a href="#" class="forgot-pass" onclick="alert('Default demo passwords:\n• Student: student123\n• Admin: admin123')">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Authenticate & Launch Platform</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form" style="display: none; margin-top: 14px;">
                <div class="input-group">
                    <label for="regFullName"><i class="fa-solid fa-user"></i> Full Name</label>
                    <div class="input-field-wrapper">
                        <input type="text" id="regFullName" placeholder="e.g. Alex Smith" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regEmail"><i class="fa-solid fa-envelope"></i> University Email</label>
                    <div class="input-field-wrapper">
                        <input type="email" id="regEmail" placeholder="e.g. alex@university.edu" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regCourse"><i class="fa-solid fa-book"></i> Enrolled Course</label>
                    <div class="input-field-wrapper">
                        <select id="regCourse" required style="width:100%; background:transparent; border:none; color:#fff; padding:8px 0; outline:none;">
                            <option value="B.Tech Computer Science" style="background:#0f172a; color:#fff;">B.Tech Computer Science</option>
                            <option value="B.Sc Data Science" style="background:#0f172a; color:#fff;">B.Sc Data Science</option>
                            <option value="BCA" style="background:#0f172a; color:#fff;">BCA (Computer Applications)</option>
                            <option value="MCA" style="background:#0f172a; color:#fff;">MCA (Master of Computer Applications)</option>
                            <option value="MBA" style="background:#0f172a; color:#fff;">MBA</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regPassword"><i class="fa-solid fa-lock"></i> Set Password</label>
                    <div class="input-field-wrapper">
                        <input type="password" id="regPassword" placeholder="Minimum 4 characters" required minlength="4">
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <span>Create & Launch Guided Platform</span> <i class="fa-solid fa-user-check"></i>
                </button>
            </form>

            <!-- Direct Social Authentication & Platform Entry -->
            <div class="auth-divider">
                <span>OR DIRECT SINGLE SIGN-ON</span>
            </div>

            <div class="social-logins">
                <button type="button" class="btn-social btn-social-google" onclick="socialLogin('Google')">
                    <i class="fa-brands fa-google"></i> Direct Google Sign-In
                </button>
                <button type="button" class="btn-social btn-social-apple" onclick="socialLogin('Apple')">
                    <i class="fa-brands fa-apple"></i> Direct Apple ID Sign-In
                </button>
                <button type="button" class="btn-social btn-social-github" onclick="socialLogin('GitHub')">
                    <i class="fa-brands fa-github"></i> Direct GitHub OAuth
                </button>
            </div>

            <!-- Pre-authenticated Guided Platform Link -->
            <div class="demo-logins">
                <span class="demo-label"><i class="fa-solid fa-rocket"></i> Direct Guided Platform Launch:</span>
                <div class="demo-buttons">
                    <button type="button" class="demo-btn" onclick="directPlatformLaunch('student')">
                        <i class="fa-solid fa-circle-play"></i> Student Platform
                    </button>
                    <button type="button" class="demo-btn admin" onclick="directPlatformLaunch('admin')">
                        <i class="fa-solid fa-shield-halved"></i> Admin Portal
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth JS Script -->
    <script>
        function formatName(rawInput) {
            if (!rawInput) return "Student";
            let clean = rawInput.trim();
            if (clean.includes('@')) {
                clean = clean.split('@')[0];
            }
            return clean.replace(/\./g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function showAlert(msg, isSuccess = false) {
            const box = document.getElementById('authAlert');
            box.style.display = 'block';
            box.style.background = isSuccess ? 'rgba(16, 185, 129, 0.2)' : 'rgba(239, 68, 68, 0.2)';
            box.style.border = isSuccess ? '1px solid #10b981' : '1px solid #ef4444';
            box.style.color = isSuccess ? '#6ee7b7' : '#fca5a5';
            box.innerHTML = msg;
        }

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginRole = document.getElementById('loginRole');
            document.getElementById('authAlert').style.display = 'none';

            if (tab === 'student') {
                document.getElementById('tabStudentBtn').classList.add('active');
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                loginRole.value = 'student';
                document.getElementById('authIdentifier').placeholder = "e.g. Alex Smith or alex@university.edu";
                document.getElementById('authPassword').placeholder = "Enter password (default: student123)";
            } else if (tab === 'admin') {
                document.getElementById('tabAdminBtn').classList.add('active');
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                loginRole.value = 'admin';
                document.getElementById('authIdentifier').placeholder = "e.g. Dr. Faculty or admin@university.edu";
                document.getElementById('authPassword').placeholder = "Enter password (default: admin123)";
            } else if (tab === 'signup') {
                document.getElementById('tabSignupBtn').classList.add('active');
                loginForm.style.display = 'none';
                signupForm.style.display = 'flex';
            }
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="fa-solid fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fa-solid fa-eye"></i>';
            }
        }

        function socialLogin(provider) {
            const typedVal = document.getElementById('authIdentifier').value.trim();
            let userName = "";

            if (typedVal) {
                userName = formatName(typedVal);
            } else {
                const promptedName = prompt(`Enter your Name to sign in with ${provider}:`, "");
                if (promptedName && promptedName.trim()) {
                    userName = formatName(promptedName);
                } else {
                    userName = `Student (${provider})`;
                }
            }

            const userObj = {
                name: userName,
                id: 'STU-' + Math.floor(1000 + Math.random() * 9000),
                role: 'Student',
                provider: provider,
                authenticated: true,
                email: `${userName.toLowerCase().replace(/\s+/g, '')}@${provider.toLowerCase()}.com`
            };

            saveUserSession(userObj);
            showAlert(`✅ Authenticated via ${provider}! Redirecting to Guided Platform...`, true);
            setTimeout(() => { window.location.href = 'index.html'; }, 700);
        }

        function directPlatformLaunch(role) {
            const userObj = {
                name: role === 'student' ? 'Student' : 'Dr. Administrator',
                id: role === 'student' ? 'STU-2026' : 'ADM-101',
                role: role === 'student' ? 'Student' : 'Admin',
                authenticated: true,
                email: role === 'student' ? 'student@university.edu' : 'admin@university.edu'
            };
            saveUserSession(userObj);
            showAlert(`🚀 Access Granted! Launching Guided Platform as ${userObj.name}...`, true);
            setTimeout(() => { window.location.href = 'index.html'; }, 600);
        }

        function saveUserSession(userObj) {
            localStorage.setItem('eduquery_user', JSON.stringify(userObj));
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const rawIdentifier = document.getElementById('authIdentifier').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const role = document.getElementById('loginRole').value;

            if (!password) {
                showAlert("⚠️ Please enter a password to authenticate.");
                return;
            }

            // Verify Password Rules
            if (role === 'admin' && password !== 'admin123' && password !== '1234') {
                showAlert("❌ Invalid Admin Password! (Default Admin Password: <strong>admin123</strong>)");
                return;
            }

            const displayName = formatName(rawIdentifier);

            const userObj = {
                name: displayName,
                id: role === 'student' ? 'STU-' + Math.floor(1000 + Math.random() * 9000) : 'ADM-101',
                role: role === 'student' ? 'Student' : 'Admin',
                authenticated: true,
                email: rawIdentifier.includes('@') ? rawIdentifier : `${displayName.toLowerCase().replace(/\s+/g, '')}@university.edu`
            };

            saveUserSession(userObj);
            showAlert(`✅ Credentials Verified! Redirecting to Guided Platform...`, true);
            setTimeout(() => { window.location.href = 'index.html'; }, 600);
        });

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const course = document.getElementById('regCourse').value;
            const password = document.getElementById('regPassword').value.trim();

            if (password.length < 4) {
                showAlert("⚠️ Password must be at least 4 characters.");
                return;
            }

            const userObj = {
                name: formatName(fullName),
                id: 'STU-' + Math.floor(1000 + Math.random() * 9000),
                role: 'Student',
                course: course,
                authenticated: true,
                email: email
            };

            saveUserSession(userObj);
            showAlert(`🎉 Account Created & Verified! Opening Guided Platform...`, true);
            setTimeout(() => { window.location.href = 'index.html'; }, 800);
        });
    </script>
</body>
</html>
